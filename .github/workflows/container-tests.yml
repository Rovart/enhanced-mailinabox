# Runs the container tests (tests/container, see its README) on every supported
# operating system: a fresh install, and an upgrade from the latest release tag.
# Each combination runs in its own job, since each needs about 5 GB of disk.
# Runs on every pull request, since main requires these checks, but only tests the ones
# that change what the tests cover (the setup, the management daemon, conf/, tools/ and
# the tests themselves): on the others each job passes at once. Also runs by hand
# (Actions > Container tests > Run workflow), testing everything.
name: Container tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04]
        mode: [fresh, upgrade]
    name: ${{ matrix.os }} (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Not a paths filter on the workflow, nor an "if:" on the job: then the required
      # checks would never report (a skipped matrix job reports under its unexpanded name).
      - name: Changes to test
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "Run by hand: testing everything."
            echo "test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          if printf '%s\n' "$files" | grep -E '^(setup|management|conf|tools|tests/container)/|^\.github/workflows/container-tests\.yml$'; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the container tests cover changed: passing without testing."
            echo "test=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Static checks
        if: steps.changes.outputs.test == 'true'
        run: tests/static-checks.sh

      - name: Install and test
        if: steps.changes.outputs.test == 'true'
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = upgrade ]; then
            base=$(git tag --list 'v*' --sort=-version:refname --merged HEAD | head -n 1)
            echo "Upgrading from $base"
            sudo LOGDIR=/tmp/pmiab-tests tests/container/run-all.sh -u "$base" ${{ matrix.os }}
          else
            sudo LOGDIR=/tmp/pmiab-tests tests/container/run-all.sh ${{ matrix.os }}
          fi

      - name: Failed units in the container
        if: failure()
        run: |
          name=pmiab-test-${{ matrix.os }}
          sudo docker exec $name systemctl --failed --no-pager || true
          for unit in $(sudo docker exec $name systemctl --failed --no-legend --plain | awk '{print $1}'); do
            sudo docker exec $name journalctl -u "$unit" --no-pager -n 40 || true
          done
          sudo docker exec $name journalctl -u munin-node --no-pager -n 60 || true
          sudo docker exec $name cat /var/log/munin/munin-node.log 2>/dev/null | tail -30 || true

      - name: Keep the logs
        if: always() && steps.changes.outputs.test == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.mode }}
          path: /tmp/pmiab-tests
          if-no-files-found: ignore
